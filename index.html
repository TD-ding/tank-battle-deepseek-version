<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 deepseek-version</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
#game-wrapper { position: relative; text-align: center; }
h1 {
  color: #e94560;
  margin-bottom: 10px;
  font-size: 22px;
  text-shadow: 0 0 10px rgba(233,69,96,0.5);
  letter-spacing: 2px;
}
canvas {
  border: 2px solid #e94560;
  box-shadow: 0 0 20px rgba(233,69,96,0.3);
  display: block;
  margin: 0 auto;
}
#info {
  color: #aaa;
  margin-top: 10px;
  font-size: 13px;
}
#mobile-controls {
  display: none;
  margin-top: 8px;
  user-select: none;
  -webkit-user-select: none;
}
#mobile-controls .row { display: flex; justify-content: center; gap: 4px; margin-bottom: 4px; }
#mobile-controls button {
  width: 48px; height: 48px;
  background: #2a2a3e;
  color: #e94560;
  border: 1px solid #555;
  border-radius: 8px;
  font-size: 20px;
  cursor: pointer;
  touch-action: manipulation;
}
#mobile-controls button:active { background: #e94560; color: #fff; }
@media (max-width: 680px) {
  #mobile-controls { display: block; }
  h1 { font-size: 16px; }
}
</style>
</head>
<body>
<div id="game-wrapper">
  <h1>坦克大战 deepseek-version</h1>
  <canvas id="game"></canvas>
  <div id="info">方向键 / WASD 移动 | 空格射击 | P 暂停 | R 重新开始</div>
  <div id="mobile-controls">
    <div class="row"><button data-key="ArrowUp">↑</button></div>
    <div class="row">
      <button data-key="ArrowLeft">←</button>
      <button data-key=" ">🔫</button>
      <button data-key="ArrowRight">→</button>
    </div>
    <div class="row"><button data-key="ArrowDown">↓</button></div>
  </div>
</div>
<script>
(function() {
  const CONFIG = {
    TILE: 32,
    COLS: 20,
    ROWS: 15,
    PLAYER_SPEED: 180,
    ENEMY_BASE_SPEED: 80,
    ENEMY_SPEED_PER_LEVEL: 6,
    PLAYER_SHOOT_COOLDOWN: 0.25,
    ENEMY_SHOOT_COOLDOWN: 1.2,
    ENEMY_MOVE_INTERVAL: 0.5,
    ENEMY_SHOOT_INTERVAL: 0.8,
    SPAWN_INTERVAL: 2.0,
    MAX_ENEMIES_ON_SCREEN: 4,
    BULLET_SPEED: 300,
    BULLET_SIZE: 6,
    TANK_SIZE_RATIO: 0.85,
    BRIEF_INVULN: 0.8,
    KILL_SCORE: 100,
    LEVEL_BONUS: 200,
    START_LIVES: 3,
    COMBO_TIMEOUT: 1.5,
    SCREEN_SHAKE_DECAY: 4,
    BRICK_HP: 2
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const TILE = CONFIG.TILE;
  const COLS = CONFIG.COLS;
  const ROWS = CONFIG.ROWS;
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;

  const DIR = {
    UP:    { x: 0, y: -1, angle: -Math.PI/2 },
    DOWN:  { x: 0, y:  1, angle:  Math.PI/2 },
    LEFT:  { x: -1, y: 0, angle:  Math.PI },
    RIGHT: { x: 1, y:  0, angle:  0 }
  };
  const DIR_LIST = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];

  const STATE = { START: 0, PLAYING: 1, PAUSED: 2, GAMEOVER: 3 };

  // audio
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  }
  function playTone(freq, duration, type, vol, glideTo) {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t + duration);
      gain.gain.setValueAtTime(vol || 0.08, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + duration);
    } catch(e) {}
  }
  function sfxShoot()     { playTone(800, 0.08, 'square', 0.06, 200); }
  function sfxHit()       { playTone(150, 0.15, 'sawtooth', 0.1, 50); }
  function sfxExplosion() { playTone(60, 0.3, 'sawtooth', 0.15, 20); }
  function sfxPowerup()   { playTone(600, 0.1, 'square', 0.08); playTone(900, 0.1, 'square', 0.08, 1200); }
  function sfxLevelUp() {
    playTone(400, 0.12, 'square', 0.08);
    setTimeout(() => playTone(600, 0.12, 'square', 0.08), 120);
    setTimeout(() => playTone(800, 0.18, 'square', 0.08), 240);
  }
  function sfxGameOver()  {
    playTone(300, 0.2, 'sawtooth', 0.1, 100);
    setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.1, 60), 200);
  }
  function sfxPlayerHit() { playTone(100, 0.25, 'sawtooth', 0.15, 30); }
  function sfxStart()     { playTone(500, 0.1, 'square', 0.06); setTimeout(() => playTone(700, 0.15, 'square', 0.07), 100); }

  let walls = [], player = null, enemies = [], bullets = [], explosions = [];
  let powerups = [], particles = [], spawnQueue = [], floatingTexts = [];
  let score = 0, lives = CONFIG.START_LIVES, level = 1;
  let state = STATE.START;
  let keys = {};
  let dt = 0, lastTime = 0;
  let enemyMoveAcc = 0, enemyShootAcc = 0, spawnAcc = 0;
  let invulnTimer = 0;
  let comboCount = 0, comboTimer = 0;
  let shakeX = 0, shakeY = 0;
  let levelTransition = 0;
  let highScore = 0;
  let startBlink = 0;

  // load high score
  try { highScore = parseInt(localStorage.getItem('tankBattleHighScore')) || 0; } catch(e) {}

  function saveHighScore() {
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem('tankBattleHighScore', highScore); } catch(e) {}
    }
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function addScreenShake(intensity) {
    shakeX += Math.cos(Math.random() * Math.PI * 2) * intensity;
    shakeY += Math.sin(Math.random() * Math.PI * 2) * intensity;
  }

  function addFloatingText(x, y, text, color) {
    floatingTexts.push({ x, y, text, color: color || '#ff0', life: 1.0, maxLife: 1.0 });
  }

  function addParticles(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: Math.cos(Math.random() * Math.PI * 2) * (40 + Math.random() * 120),
        vy: Math.sin(Math.random() * Math.PI * 2) * (40 + Math.random() * 120),
        life: 0.3 + Math.random() * 0.5,
        maxLife: 0.4,
        color: color || '#f80',
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function enemySpeed() {
    return CONFIG.ENEMY_BASE_SPEED + (level - 1) * CONFIG.ENEMY_SPEED_PER_LEVEL;
  }

  function enemyMaxHP(type) {
    if (type === 'heavy') return 3;
    if (type === 'scout') return 1;
    return 1;
  }

  class Tank {
    constructor(x, y, dir, color, isPlayer, enemyType) {
      this.x = x;
      this.y = y;
      this.dir = dir || DIR.UP;
      this.color = color;
      this.isPlayer = isPlayer;
      const spd = isPlayer ? CONFIG.PLAYER_SPEED :
        enemyType === 'scout' ? enemySpeed() * 1.5 :
        enemyType === 'heavy' ? enemySpeed() * 0.6 :
        enemySpeed();
      this.speed = spd;
      this.size = isPlayer ? TILE * CONFIG.TANK_SIZE_RATIO :
        enemyType === 'heavy' ? TILE * 0.95 :
        TILE * CONFIG.TANK_SIZE_RATIO;
      this.hp = isPlayer ? 1 : enemyMaxHP(enemyType);
      this.enemyType = enemyType || 'normal';
      this.shootAcc = 0;
      this.cooldownSec = isPlayer ? CONFIG.PLAYER_SHOOT_COOLDOWN :
        enemyType === 'scout' ? CONFIG.ENEMY_SHOOT_COOLDOWN * 0.6 :
        CONFIG.ENEMY_SHOOT_COOLDOWN;
    }

    rect() {
      const hs = this.size / 2;
      return { x: this.x - hs, y: this.y - hs, w: this.size, h: this.size };
    }

    collidesWalls(walls) {
      const r = this.rect();
      for (const w of walls) {
        if (w.type === 'brick' && w.hp <= 0) continue;
        if (rectsOverlap(r, w)) return true;
      }
      return r.x < 0 || r.y < 0 || r.x + r.w > canvas.width || r.y + r.h > canvas.height;
    }

    collidesTank(other) {
      if (other === this) return false;
      return rectsOverlap(this.rect(), other.rect());
    }

    move(d, dtSec, walls, allTanks) {
      const prev = { x: this.x, y: this.y };
      this.x += d.x * this.speed * dtSec;
      this.y += d.y * this.speed * dtSec;
      if (this.collidesWalls(walls)) {
        this.x = prev.x;
        this.y = prev.y;
        return false;
      }
      for (const t of allTanks) {
        if (t !== this && this.collidesTank(t)) {
          this.x = prev.x;
          this.y = prev.y;
          return false;
        }
      }
      return true;
    }

    shoot(dtSec) {
      this.shootAcc += dtSec;
      if (this.shootAcc < this.cooldownSec) return null;
      this.shootAcc = 0;
      sfxShoot();
      return new Bullet(this.x, this.y, this.dir, CONFIG.BULLET_SIZE, CONFIG.BULLET_SPEED, this.isPlayer);
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.dir.angle);

      const hs = this.size / 2;

      // body color varies by type
      ctx.fillStyle = this.color;
      if (this.enemyType === 'heavy') {
        ctx.fillStyle = '#c33';
      } else if (this.enemyType === 'scout') {
        ctx.fillStyle = '#fa3';
      }
      ctx.fillRect(-hs, -hs, this.size, this.size);

      // treads
      ctx.fillStyle = '#333';
      ctx.fillRect(-hs - 3, -hs, 6, this.size);
      ctx.fillRect(hs - 3, -hs, 6, this.size);

      // barrel
      ctx.fillStyle = '#555';
      ctx.fillRect(-2, -hs - 8, 4, 14);

      // canopy
      ctx.fillStyle = this.isPlayer
        ? (this.hp > 1 ? '#0ff' : '#0f0')
        : this.enemyType === 'heavy' ? '#f00' : this.enemyType === 'scout' ? '#fa0' : '#f44';
      ctx.beginPath();
      ctx.arc(0, 0, hs * 0.55, 0, Math.PI * 2);
      ctx.fill();

      // HP indicator for heavy enemies
      if (!this.isPlayer && this.hp > 1) {
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('x' + this.hp, 0, 0);
      }

      ctx.restore();
    }
  }

  class Bullet {
    constructor(x, y, dir, size, speed, isPlayer) {
      this.x = x;
      this.y = y;
      this.dir = dir;
      this.size = size;
      this.speed = speed;
      this.isPlayer = isPlayer;
      this.alive = true;
      this.trail = [];
    }

    rect() {
      const hs = this.size / 2;
      return { x: this.x - hs, y: this.y - hs, w: this.size, h: this.size };
    }

    update(dtSec) {
      this.trail.push({ x: this.x, y: this.y, life: 0.06 });
      this.x += this.dir.x * this.speed * dtSec;
      this.y += this.dir.y * this.speed * dtSec;

      const r = this.rect();
      if (r.x < 0 || r.y < 0 || r.x + r.w > canvas.width || r.y + r.h > canvas.height) {
        this.alive = false; return;
      }
      for (const w of walls) {
        if (w.type === 'brick' && w.hp <= 0) continue;
        if (rectsOverlap(r, w)) {
          this.alive = false;
          if (w.type === 'brick') {
            w.hp--;
            addParticles(this.x, this.y, 6, '#b5651d');
            sfxHit();
            if (w.hp <= 0) {
              addParticles(w.x + TILE/2, w.y + TILE/2, 8, '#8B4513');
            }
          } else {
            addParticles(this.x, this.y, 3, '#999');
            sfxHit();
          }
          return;
        }
      }
      for (const t of [player, ...enemies]) {
        if (t.hp <= 0) continue;
        if (this.isPlayer === t.isPlayer) continue;
        if (rectsOverlap(r, t.rect())) {
          this.alive = false;
          t.hp--;
          if (t.hp <= 0) {
            addExplosion(t.x, t.y, t.size / TILE);
            addParticles(t.x, t.y, 15, t.color);
            addScreenShake(t.size / 8);
            sfxExplosion();
            if (!t.isPlayer) {
              comboCount++;
              comboTimer = CONFIG.COMBO_TIMEOUT;
              const pts = CONFIG.KILL_SCORE * comboCount *
                (t.enemyType === 'heavy' ? 3 : t.enemyType === 'scout' ? 1 : 1);
              score += pts;
              if (comboCount > 1) {
                addFloatingText(t.x, t.y - 20, `${comboCount}x +${pts}`, '#ff0');
              }
              maybeDropPowerup(t.x, t.y);
            }
          } else {
            sfxHit();
            addParticles(this.x, this.y, 3, '#fff');
          }
          return;
        }
      }
      for (let i = this.trail.length - 1; i >= 0; i--) {
        this.trail[i].life -= dtSec;
        if (this.trail[i].life <= 0) this.trail.splice(i, 1);
      }
    }

    draw(ctx) {
      for (const t of this.trail) {
        ctx.fillStyle = `rgba(255,200,50,${Math.max(0, t.life / 0.06 * 0.6)})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = this.isPlayer ? '#ff0' : '#f66';
      ctx.shadowBlur = 6;
      ctx.shadowColor = this.isPlayer ? '#ff0' : '#f66';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  class PowerUp {
    constructor(x, y, type) {
      this.x = x;
      this.y = y;
      this.type = type;
      this.size = TILE * 0.5;
      this.life = 15;
    }

    rect() {
      const hs = this.size / 2;
      return { x: this.x - hs, y: this.y - hs, w: this.size, h: this.size };
    }

    update(dtSec) {
      this.life -= dtSec;
      if (this.life <= 0) return;
      if (player.hp > 0 && rectsOverlap(player.rect(), this.rect())) {
        this.apply();
        this.life = 0;
        sfxPowerup();
        const label = this.type === 'life' ? '+1 ♥' : this.type === 'speed' ? '加速!' : '护盾!';
        addFloatingText(this.x, this.y, label, '#0f0');
      }
    }

    apply() {
      if (this.type === 'life') {
        lives = Math.min(lives + 1, 5);
      } else if (this.type === 'speed') {
        player.speed = CONFIG.PLAYER_SPEED * 1.6;
        setTimeout(() => { if (player) player.speed = CONFIG.PLAYER_SPEED; }, 8000);
      } else if (this.type === 'shield') {
        player.hp = 3;
      }
    }

    draw(ctx) {
      const flash = Math.sin(Date.now() / 150) > 0;
      if (this.life < 3 && flash) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      if (this.type === 'life') {
        ctx.fillStyle = '#f55';
        ctx.beginPath(); ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `${this.size * 0.8}px monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('♥', 0, 1);
      } else if (this.type === 'speed') {
        ctx.fillStyle = '#5af';
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.fillStyle = '#fff';
        ctx.font = `${this.size * 0.7}px monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('⚡', 0, 1);
      } else if (this.type === 'shield') {
        ctx.fillStyle = '#af5';
        ctx.beginPath(); ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `${this.size * 0.7}px monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🛡', 0, 0);
      }
      ctx.restore();
    }
  }

  function addExplosion(x, y, scale) {
    explosions.push({ x, y, r: 4, maxR: 20 * scale, life: 0.3, maxLife: 0.3 });
  }

  const POWERUP_TYPES = ['life', 'speed', 'shield'];
  function maybeDropPowerup(x, y) {
    if (Math.random() < 0.22) {
      powerups.push(new PowerUp(x, y, POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)]));
    }
  }

  function genWalls() {
    const w = [];
    for (let col = 0; col < COLS; col++) {
      w.push({ x: col * TILE, y: 0, w: TILE, h: TILE, type: 'steel', hp: Infinity });
      w.push({ x: col * TILE, y: (ROWS - 1) * TILE, w: TILE, h: TILE, type: 'steel', hp: Infinity });
    }
    for (let row = 1; row < ROWS - 1; row++) {
      w.push({ x: 0, y: row * TILE, w: TILE, h: TILE, type: 'steel', hp: Infinity });
      w.push({ x: (COLS - 1) * TILE, y: row * TILE, w: TILE, h: TILE, type: 'steel', hp: Infinity });
    }
    const patterns = [
      [3,2],[7,3],[11,2],[16,3],
      [3,6],[8,6],[12,6],[17,6],
      [5,9],[10,8],[15,9],
      [3,12],[7,11],[13,11],[17,12],
      [5,4],[15,4],[5,10],[15,10]
    ];
    for (const [cx, cy] of patterns) {
      w.push({ x: cx * TILE, y: cy * TILE, w: TILE, h: TILE, type: 'brick', hp: CONFIG.BRICK_HP });
    }
    return w;
  }

  function spawnPlayer() {
    const p = new Tank(TILE * 10, TILE * 13, DIR.UP, '#4a9', true);
    invulnTimer = CONFIG.BRIEF_INVULN;
    comboCount = 0;
    comboTimer = 0;
    return p;
  }

  function spawnEnemy(x, y, dir, type) {
    const colors = { normal: '#e44', scout: '#fa3', heavy: '#c33' };
    return new Tank(x, y, dir || DIR.DOWN, colors[type] || '#e44', false, type);
  }

  function randomEnemyType(lev) {
    const r = Math.random();
    if (r < 0.15 + lev * 0.02) return 'heavy';
    if (r < 0.35 + lev * 0.02) return 'scout';
    return 'normal';
  }

  function resetLevel() {
    player = spawnPlayer();
    enemies = [];
    bullets = [];
    explosions = [];
    powerups = [];
    particles = [];
    floatingTexts = [];
    spawnQueue = [];
    enemyMoveAcc = 0;
    enemyShootAcc = 0;
    spawnAcc = 0;
    shakeX = 0;
    shakeY = 0;
    levelTransition = 2.0;
    const count = 3 + level;
    for (let i = 0; i < count; i++) {
      spawnQueue.push({
        x: TILE * (2 + i * 5),
        y: TILE * 1,
        type: randomEnemyType(level)
      });
    }
  }

  function resetGame() {
    score = 0;
    lives = CONFIG.START_LIVES;
    level = 1;
    state = STATE.PLAYING;
    walls = genWalls();
    resetLevel();
    sfxStart();
  }

  function drawWalls() {
    for (const w of walls) {
      if (w.type === 'brick' && w.hp <= 0) continue;
      if (w.type === 'steel') {
        ctx.fillStyle = '#555';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = '#777';
        ctx.fillRect(w.x + 2, w.y + 2, w.w - 4, w.h - 4);
        ctx.fillStyle = '#999';
        ctx.fillRect(w.x + 4, w.y + 4, w.w - 8, w.h - 8);
      } else {
        // damaged bricks get darker
        const dmg = w.hp / CONFIG.BRICK_HP;
        ctx.fillStyle = dmg > 0.5 ? '#b5651d' : '#7a3b10';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 1;
        for (let py = w.y; py < w.y + w.h; py += 8) {
          ctx.beginPath();
          ctx.moveTo(w.x + ((py / 8) % 2) * 8, py);
          ctx.lineTo(w.x + ((py / 8) % 2) * 8 + 8, py);
          ctx.stroke();
        }
        // cracks when damaged
        if (dmg <= 0.5) {
          ctx.strokeStyle = '#333';
          ctx.beginPath();
          ctx.moveTo(w.x + 4, w.y + 4);
          ctx.lineTo(w.x + w.w - 4, w.y + w.h - 4);
          ctx.moveTo(w.x + w.w - 4, w.y + 4);
          ctx.lineTo(w.x + 4, w.y + w.h - 4);
          ctx.stroke();
        }
      }
    }
  }

  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText(`得分: ${score}`, 20, canvas.height - 32);
    ctx.fillText(`最高: ${highScore}`, 20, canvas.height - 14);
    ctx.fillText(`等级: ${level}`, 180, canvas.height - 16);
    ctx.fillText(`生命: ${'♥'.repeat(lives)}`, 340, canvas.height - 16);

    if (comboCount > 1 && comboTimer > 0) {
      ctx.fillStyle = `rgba(255,200,0,${Math.min(1, comboTimer)})`;
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText(`${comboCount}x COMBO!`, 500, canvas.height - 16);
    }
  }

  function drawOverlay(msg, sub) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(msg, canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '16px "Courier New", monospace';
    ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = 'start';
  }

  function drawLevelTransition() {
    if (levelTransition <= 0) return;
    ctx.fillStyle = `rgba(233,69,96,${Math.min(1, levelTransition)})`;
    ctx.font = `bold ${Math.floor(28 * (1 + (1 - Math.min(1, levelTransition)) * 0.5))}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`第 ${level} 关`, canvas.width / 2, canvas.height / 2);
  }

  function drawStartScreen() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 36px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('坦克大战', canvas.width / 2, canvas.height / 2 - 60);

    ctx.fillStyle = '#aaa';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('deepseek-version', canvas.width / 2, canvas.height / 2 - 30);

    // enemy type legend
    const legends = [
      { color: '#e44', label: '普通坦克', desc: '速度正常' },
      { color: '#fa3', label: '侦察坦克', desc: '移动快 射速高' },
      { color: '#c33', label: '重型坦克', desc: '高血量 体型大' }
    ];
    ctx.font = '12px "Courier New", monospace';
    let ly = canvas.height / 2;
    for (const l of legends) {
      ctx.fillStyle = l.color;
      ctx.fillRect(canvas.width / 2 - 100, ly, 14, 14);
      ctx.fillStyle = '#ddd';
      ctx.textAlign = 'start';
      ctx.fillText(`${l.label} - ${l.desc}`, canvas.width / 2 - 80, ly + 11);
      ly += 22;
    }

    // blink text
    startBlink += dt;
    if (Math.floor(startBlink * 2) % 2 === 0) {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('按 Enter / 点击屏幕 开始游戏', canvas.width / 2, canvas.height / 2 + 120);
    }

    ctx.fillStyle = '#666';
    ctx.font = '13px "Courier New", monospace';
    ctx.fillText('方向键/WASD 移动 | 空格射击 | 砖墙可摧毁', canvas.width / 2, canvas.height / 2 + 150);
    ctx.textAlign = 'start';
  }

  function enemyMoveTowardsPlayer(e, dtSec) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    e.dir = Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? DIR.RIGHT : DIR.LEFT)
      : (dy > 0 ? DIR.DOWN : DIR.UP);
    return e.move(e.dir, dtSec, walls, [player, ...enemies]);
  }

  function update(dtSec) {
    if (state === STATE.START) return;
    if (state !== STATE.PLAYING) return;

    const cap = 0.05;
    const sdt = Math.min(dtSec, cap);

    shakeX *= Math.exp(-CONFIG.SCREEN_SHAKE_DECAY * sdt);
    shakeY *= Math.exp(-CONFIG.SCREEN_SHAKE_DECAY * sdt);
    if (Math.abs(shakeX) < 0.1) shakeX = 0;
    if (Math.abs(shakeY) < 0.1) shakeY = 0;

    if (levelTransition > 0) levelTransition -= sdt;
    if (comboTimer > 0) { comboTimer -= sdt; if (comboTimer <= 0) comboCount = 0; }

    // player input
    const up    = keys['ArrowUp']    || keys['w'] || keys['W'];
    const down  = keys['ArrowDown']  || keys['s'] || keys['S'];
    const left  = keys['ArrowLeft']  || keys['a'] || keys['A'];
    const right = keys['ArrowRight'] || keys['d'] || keys['D'];
    const fire  = keys[' '];

    if (up)    player.move(DIR.UP, sdt, walls, [player, ...enemies]);
    if (down)  player.move(DIR.DOWN, sdt, walls, [player, ...enemies]);
    if (left)  player.move(DIR.LEFT, sdt, walls, [player, ...enemies]);
    if (right) player.move(DIR.RIGHT, sdt, walls, [player, ...enemies]);

    if (up)    player.dir = DIR.UP;
    else if (down)  player.dir = DIR.DOWN;
    else if (left)  player.dir = DIR.LEFT;
    else if (right) player.dir = DIR.RIGHT;

    if (fire) {
      const b = player.shoot(sdt);
      if (b) bullets.push(b);
    }

    if (invulnTimer > 0) {
      invulnTimer -= sdt;
      if (player.hp <= 1) player.hp = 2;
      if (invulnTimer <= 0 && player.hp <= 2) player.hp = 1;
    }

    // enemy AI
    enemyMoveAcc += sdt;
    if (enemyMoveAcc >= CONFIG.ENEMY_MOVE_INTERVAL && enemies.length > 0) {
      enemyMoveAcc = 0;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const chaseChance = e.enemyType === 'scout' ? 0.65 : e.enemyType === 'heavy' ? 0.4 : 0.5;
        if (Math.random() < chaseChance) {
          enemyMoveTowardsPlayer(e, sdt);
        } else {
          e.dir = DIR_LIST[Math.floor(Math.random() * 4)];
          e.move(e.dir, sdt, walls, [player, ...enemies]);
        }
      }
    }

    enemyShootAcc += sdt;
    if (enemyShootAcc >= CONFIG.ENEMY_SHOOT_INTERVAL) {
      enemyShootAcc = 0;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const shootChance = e.enemyType === 'scout' ? 0.45 : e.enemyType === 'heavy' ? 0.25 : 0.35;
        if (Math.random() < shootChance) {
          const b = e.shoot(sdt);
          if (b) bullets.push(b);
        }
      }
    }

    spawnAcc += sdt;
    if (spawnAcc >= CONFIG.SPAWN_INTERVAL && spawnQueue.length > 0 &&
        enemies.filter(e => e.hp > 0).length < CONFIG.MAX_ENEMIES_ON_SCREEN) {
      spawnAcc = 0;
      const s = spawnQueue.shift();
      enemies.push(spawnEnemy(s.x, s.y, s.type));
    }

    for (const b of bullets) { if (b.alive) b.update(sdt); }
    bullets = bullets.filter(b => b.alive);
    for (const ex of explosions) { ex.r += 80 * dtSec; ex.life -= dtSec; }
    explosions = explosions.filter(e => e.life > 0);
    for (const p of powerups) { if (p.life > 0) p.update(sdt); }
    powerups = powerups.filter(p => p.life > 0);
    for (const p of particles) { p.x += p.vx * sdt; p.y += p.vy * sdt; p.life -= sdt; }
    particles = particles.filter(p => p.life > 0);
    for (const ft of floatingTexts) { ft.y -= 30 * sdt; ft.life -= sdt; }
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
    enemies = enemies.filter(e => e.hp > 0);

    if (player.hp <= 0) {
      addExplosion(player.x, player.y, 1.0);
      addParticles(player.x, player.y, 20, '#4a9');
      addScreenShake(8);
      sfxPlayerHit();
      lives--;
      if (lives <= 0) {
        state = STATE.GAMEOVER;
        saveHighScore();
        sfxGameOver();
      } else {
        player = spawnPlayer();
      }
    }

    if (enemies.length === 0 && spawnQueue.length === 0) {
      level++;
      score += CONFIG.LEVEL_BONUS;
      sfxLevelUp();
      walls = genWalls();
      resetLevel();
    }
  }

  function render() {
    if (state === STATE.START) {
      drawStartScreen();
      return;
    }

    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(shakeX, shakeY);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += TILE) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += TILE) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    drawWalls();
    for (const p of powerups) { if (p.life > 0) p.draw(ctx); }
    for (const b of bullets) b.draw(ctx);
    for (const e of enemies) e.draw(ctx);

    if (invulnTimer <= 0 || Math.sin(Date.now() / 50) > 0) {
      player.draw(ctx);
    }

    for (const p of particles) {
      ctx.fillStyle = `rgba(255,160,30,${p.life / p.maxLife})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const ex of explosions) {
      const a = ex.life / ex.maxLife;
      ctx.fillStyle = `rgba(255,160,30,${a})`;
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,255,200,${a * 0.7})`;
      ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.r * 0.5, 0, Math.PI * 2); ctx.fill();
    }

    for (const ft of floatingTexts) {
      ctx.fillStyle = `rgba(255,255,100,${ft.life / ft.maxLife})`;
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.textAlign = 'start';
    }

    ctx.restore();

    drawHUD();
    drawLevelTransition();

    if (state === STATE.GAMEOVER) {
      const newBest = score >= highScore ? '  🏆 新纪录!' : '';
      drawOverlay('游戏结束', `最终得分: ${score}  |  第 ${level} 关${newBest}  |  按 R 重新开始`);
    } else if (state === STATE.PAUSED) {
      drawOverlay('暂停', '按 P 继续');
    }
  }

  function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
  }

  keys = {};
  window.addEventListener('keydown', e => {
    initAudio();
    keys[e.key] = true;
    if (e.key === 'Enter') {
      if (state === STATE.START) resetGame();
    }
    if (e.key === 'r' || e.key === 'R') {
      if (state === STATE.GAMEOVER) { resetGame(); return; }
    }
    if (e.key === 'p' || e.key === 'P') {
      if (state === STATE.PLAYING) state = STATE.PAUSED;
      else if (state === STATE.PAUSED) state = STATE.PLAYING;
    }
    if (e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  document.querySelectorAll('#mobile-controls button').forEach(btn => {
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      initAudio();
      if (state === STATE.START) resetGame();
      keys[btn.dataset.key] = true;
    });
    btn.addEventListener('pointerup', e => { e.preventDefault(); keys[btn.dataset.key] = false; });
    btn.addEventListener('pointerleave', e => { keys[btn.dataset.key] = false; });
  });

  canvas.addEventListener('click', () => {
    initAudio();
    if (state === STATE.START) resetGame();
  });

  state = STATE.START;
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
