<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 deepseek-version</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Courier New', monospace;
  overflow: hidden;
}
#game-wrapper {
  position: relative;
  text-align: center;
}
h1 {
  color: #e94560;
  margin-bottom: 10px;
  font-size: 22px;
  text-shadow: 0 0 10px rgba(233,69,96,0.5);
  letter-spacing: 2px;
}
canvas {
  border: 2px solid #e94560;
  box-shadow: 0 0 20px rgba(233,69,96,0.3);
  display: block;
  margin: 0 auto;
}
#info {
  color: #aaa;
  margin-top: 10px;
  font-size: 13px;
}
</style>
</head>
<body>
<div id="game-wrapper">
  <h1>坦克大战 deepseek-version</h1>
  <canvas id="game"></canvas>
  <div id="info">方向键移动 | 空格射击 | R 重新开始</div>
</div>
<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const TILE = 32;
  const COLS = 20;
  const ROWS = 15;
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;

  const DIRS = {
    UP:    { x: 0, y: -1, angle: -Math.PI/2 },
    DOWN:  { x: 0, y:  1, angle:  Math.PI/2 },
    LEFT:  { x: -1, y: 0, angle:  Math.PI },
    RIGHT: { x: 1, y:  0, angle:  0 }
  };

  const STATE = { PLAYING: 0, GAMEOVER: 1, WIN: 2 };

  let walls, player, enemies, bullets, effects;
  let score, lives, level, state, keys;
  let enemyMoveTimer, enemyShootTimer, spawnTimer;
  let spawnQueue = [];

  class Tank {
    constructor(x, y, dir, color, isPlayer) {
      this.x = x;
      this.y = y;
      this.dir = dir || DIRS.UP;
      this.color = color;
      this.isPlayer = isPlayer;
      this.speed = isPlayer ? 3 : 1.2;
      this.size = TILE * 0.85;
      this.hp = 1;
      this.shootCooldown = 0;
      this.cooldownMax = isPlayer ? 15 : 60;
    }

    rect() {
      const hs = this.size / 2;
      return { x: this.x - hs, y: this.y - hs, w: this.size, h: this.size };
    }

    collidesWalls(walls) {
      const r = this.rect();
      for (const w of walls) {
        if (rectsOverlap(r, w)) return true;
      }
      if (r.x < 0 || r.y < 0 || r.x + r.w > canvas.width || r.y + r.h > canvas.height) return true;
      return false;
    }

    collidesTank(other) {
      if (other === this) return false;
      const r1 = this.rect();
      const r2 = other.rect();
      return rectsOverlap(r1, r2);
    }

    move(d, walls, allTanks) {
      const prev = { x: this.x, y: this.y };
      this.x += d.x * this.speed;
      this.y += d.y * this.speed;
      if (this.collidesWalls(walls)) {
        this.x = prev.x;
        this.y = prev.y;
        return false;
      }
      for (const t of allTanks) {
        if (t !== this && this.collidesTank(t)) {
          this.x = prev.x;
          this.y = prev.y;
          return false;
        }
      }
      return true;
    }

    shoot() {
      if (this.shootCooldown > 0) return null;
      this.shootCooldown = this.cooldownMax;
      const bs = 6;
      const spd = 5;
      return new Bullet(this.x, this.y, this.dir, bs, spd, this.isPlayer);
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.dir.angle);

      // body
      ctx.fillStyle = this.color;
      const hs = this.size / 2;
      ctx.fillRect(-hs, -hs, this.size, this.size);

      // treads
      ctx.fillStyle = '#333';
      ctx.fillRect(-hs - 3, -hs, 6, this.size);
      ctx.fillRect(hs - 3, -hs, 6, this.size);

      // barrel
      ctx.fillStyle = '#555';
      ctx.fillRect(-2, -hs - 8, 4, 14);

      // canopy
      ctx.fillStyle = this.isPlayer ? '#0f0' : '#f44';
      ctx.beginPath();
      ctx.arc(0, 0, hs * 0.55, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      if (this.shootCooldown > 0) this.shootCooldown--;
    }
  }

  class Bullet {
    constructor(x, y, dir, size, speed, isPlayer) {
      this.x = x;
      this.y = y;
      this.dir = dir;
      this.size = size;
      this.speed = speed;
      this.isPlayer = isPlayer;
      this.alive = true;
      this.trail = [];
    }

    rect() {
      const hs = this.size / 2;
      return { x: this.x - hs, y: this.y - hs, w: this.size, h: this.size };
    }

    update(walls, tanks) {
      this.trail.push({ x: this.x, y: this.y, life: 3 });
      this.x += this.dir.x * this.speed;
      this.y += this.dir.y * this.speed;

      const r = this.rect();
      if (r.x < 0 || r.y < 0 || r.x + r.w > canvas.width || r.y + r.h > canvas.height) {
        this.alive = false;
        return;
      }
      for (const w of walls) {
        if (rectsOverlap(r, w)) {
          this.alive = false;
          addExplosion(this.x, this.y, 0.4);
          return;
        }
      }
      for (const t of tanks) {
        if (t.hp <= 0) continue;
        if (this.isPlayer && t.isPlayer) continue;
        if (!this.isPlayer && !t.isPlayer) continue;
        if (rectsOverlap(r, t.rect())) {
          this.alive = false;
          t.hp--;
          if (t.hp <= 0) {
            addExplosion(t.x, t.y, 1.0);
            if (!t.isPlayer) score += 100;
          }
          return;
        }
      }

      for (let i = this.trail.length - 1; i >= 0; i--) {
        this.trail[i].life--;
        if (this.trail[i].life <= 0) this.trail.splice(i, 1);
      }
    }

    draw(ctx) {
      for (const t of this.trail) {
        ctx.fillStyle = `rgba(255,200,50,${t.life / 3 * 0.6})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, this.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = this.isPlayer ? '#ff0' : '#f66';
      ctx.shadowBlur = 6;
      ctx.shadowColor = this.isPlayer ? '#ff0' : '#f66';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  let explosions = [];
  function addExplosion(x, y, scale) {
    explosions.push({ x, y, r: 4, maxR: 20 * scale, life: 12, maxLife: 12 });
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function genWalls() {
    const w = [];
    // border walls
    for (let col = 0; col < COLS; col++) {
      w.push({ x: col * TILE, y: 0, w: TILE, h: TILE, type: 'steel' });
      w.push({ x: col * TILE, y: (ROWS - 1) * TILE, w: TILE, h: TILE, type: 'steel' });
    }
    for (let row = 1; row < ROWS - 1; row++) {
      w.push({ x: 0, y: row * TILE, w: TILE, h: TILE, type: 'steel' });
      w.push({ x: (COLS - 1) * TILE, y: row * TILE, w: TILE, h: TILE, type: 'steel' });
    }
    // inner walls
    const patterns = [
      [3,2], [7,3], [11,2], [16,3],
      [3,6], [8,6], [12,6], [17,6],
      [5,9], [10,8], [15,9],
      [3,12], [7,11], [13,11], [17,12],
      [5,4], [15,4], [5,10], [15,10]
    ];
    for (const [cx, cy] of patterns) {
      if (cx < COLS && cy < ROWS) {
        w.push({ x: cx * TILE, y: cy * TILE, w: TILE, h: TILE, type: 'brick' });
      }
    }
    return w;
  }

  function spawnPlayer() {
    return new Tank(TILE * 10, TILE * 13, DIRS.UP, '#4a9', true);
  }

  function spawnEnemy(x, y, dir) {
    const colors = ['#e44', '#e94', '#e6e', '#4ae', '#a4e'];
    const c = colors[Math.floor(Math.random() * colors.length)];
    return new Tank(x, y, dir || DIRS.DOWN, c, false);
  }

  function resetLevel() {
    player = spawnPlayer();
    enemies = [];
    bullets = [];
    effects = [];
    explosions = [];
    spawnQueue = [];
    enemyMoveTimer = 0;
    enemyShootTimer = 0;
    spawnTimer = 0;
    const enemyCount = 3 + level;
    for (let i = 0; i < enemyCount; i++) {
      spawnQueue.push({ x: TILE * (2 + i * 5), y: TILE * 1 });
    }
  }

  function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    state = STATE.PLAYING;
    walls = genWalls();
    resetLevel();
  }

  function drawWalls() {
    for (const w of walls) {
      if (w.type === 'steel') {
        ctx.fillStyle = '#555';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = '#777';
        ctx.fillRect(w.x + 2, w.y + 2, w.w - 4, w.h - 4);
        ctx.fillStyle = '#999';
        ctx.fillRect(w.x + 4, w.y + 4, w.w - 8, w.h - 8);
      } else {
        ctx.fillStyle = '#b5651d';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 1;
        for (let py = w.y; py < w.y + w.h; py += 8) {
          const ox = ((py / 8) % 2) * 8;
          ctx.beginPath();
          ctx.moveTo(w.x + ox, py);
          ctx.lineTo(w.x + ox + 8, py);
          ctx.stroke();
        }
      }
    }
  }

  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText(`得分: ${score}`, 20, canvas.height - 16);
    ctx.fillText(`等级: ${level}`, 180, canvas.height - 16);
    ctx.fillText(`生命: ${'♥'.repeat(lives)}`, 340, canvas.height - 16);
  }

  function drawOverlay(msg, sub) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 32px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(msg, canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = '16px "Courier New", monospace';
    ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = 'start';
  }

  function update() {
    if (state !== STATE.PLAYING) return;

    // player input
    if (keys['ArrowUp']) player.move(DIRS.UP, walls, [player, ...enemies]);
    if (keys['ArrowDown']) player.move(DIRS.DOWN, walls, [player, ...enemies]);
    if (keys['ArrowLeft']) player.move(DIRS.LEFT, walls, [player, ...enemies]);
    if (keys['ArrowRight']) player.move(DIRS.RIGHT, walls, [player, ...enemies]);
    if (keys[' ']) {
      const b = player.shoot();
      if (b) bullets.push(b);
    }

    // player dir update based on last key
    if (keys['ArrowUp']) player.dir = DIRS.UP;
    else if (keys['ArrowDown']) player.dir = DIRS.DOWN;
    else if (keys['ArrowLeft']) player.dir = DIRS.LEFT;
    else if (keys['ArrowRight']) player.dir = DIRS.RIGHT;

    // enemy AI
    enemyMoveTimer++;
    if (enemyMoveTimer > 30) {
      enemyMoveTimer = 0;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        if (Math.random() < 0.7) {
          e.move(e.dir, walls, [player, ...enemies]);
        } else {
          const dirs = [DIRS.UP, DIRS.DOWN, DIRS.LEFT, DIRS.RIGHT];
          const d = dirs[Math.floor(Math.random() * 4)];
          e.dir = d;
          e.move(d, walls, [player, ...enemies]);
        }
      }
    }

    // enemy shoot
    enemyShootTimer++;
    if (enemyShootTimer > 40) {
      enemyShootTimer = 0;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        if (Math.random() < 0.3) {
          const b = e.shoot();
          if (b) bullets.push(b);
        }
      }
    }

    // spawn enemies from queue
    spawnTimer++;
    if (spawnTimer > 80 && spawnQueue.length > 0 && enemies.filter(e => e.hp > 0).length < 4) {
      spawnTimer = 0;
      const s = spawnQueue.shift();
      const e = spawnEnemy(s.x, s.y);
      enemies.push(e);
    }

    // update bullets
    for (const b of bullets) {
      if (b.alive) b.update(walls, [player, ...enemies]);
    }
    bullets = bullets.filter(b => b.alive);

    // update explosions
    for (const ex of explosions) { ex.r += 1.5; ex.life--; }
    explosions = explosions.filter(e => e.life > 0);

    // remove dead enemies
    enemies = enemies.filter(e => e.hp > 0);

    // check player death
    if (player.hp <= 0) {
      lives--;
      if (lives <= 0) {
        state = STATE.GAMEOVER;
      } else {
        addExplosion(player.x, player.y, 1.0);
        player = spawnPlayer();
        player.shootCooldown = 30; // brief invuln via cooldown
      }
    }

    // check win condition: all enemies dead and spawn queue empty
    if (enemies.length === 0 && spawnQueue.length === 0) {
      level++;
      score += 200;
      walls = genWalls();
      resetLevel();
    }
  }

  function render() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += TILE) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += TILE) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    drawWalls();

    for (const b of bullets) b.draw(ctx);
    for (const e of enemies) e.draw(ctx);
    player.draw(ctx);

    // explosions
    for (const ex of explosions) {
      const alpha = ex.life / ex.maxLife;
      ctx.fillStyle = `rgba(255,160,30,${alpha})`;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255,255,200,${alpha * 0.7})`;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    drawHUD();

    if (state === STATE.GAMEOVER) {
      drawOverlay('游戏结束', `最终得分: ${score}  |  按 R 重新开始`);
    }
  }

  function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
  }

  // handle input
  keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'r' || e.key === 'R') {
      if (state !== STATE.PLAYING) resetGame();
    }
    if (e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  resetGame();
  gameLoop();
})();
</script>
</body>
</html>
